Step 1: Clinical Presentation
↓
Recurrent severe bacterial infections after 4–5 months of age
(consider THI, XLA, SCID, Hyper-IgM syndrome, CVID)
↓
Step 2: Serum Immunoglobulin Levels
↓
Are IgG, IgA, and IgM all markedly reduced?
        │
        ├── No → Consider:
        │        • THI (normal B-cell numbers, mild IgG dip)
        │        • Hyper-IgM syndrome (IgM normal or high)
        │        • CVID (usually older onset)
        │
        └── Yes → Severe pan-hypogammaglobulinaemia
                    Narrow differential to:
                    • XLA
                    • SCID
                    • CVID
↓
Step 3: Vaccine-Specific Antibody Responses
↓
Are vaccine antibody titres absent after immunisation?
        │
        ├── No → Suggests secondary immunodeficiency or mild PID
        │
        └── Yes → Indicates defective humoral immunity
↓
Step 4: Flow Cytometry (Lymphocyte Subsets)
↓
Are CD19+ B cells absent or extremely low while T and NK cells are normal?
        │
        ├── No → Consider:
        │        • SCID (T-cell abnormalities)
        │        • CVID (B cells present)
        │        • THI (B cells normal)
        │
        └── Yes → Strongly suggests XLA
↓
Step 5: Exclude Secondary Causes
(HIV testing, protein-losing enteropathy, nephrotic syndrome)
↓
Step 6: Genetic Testing
↓
BTK gene sequencing identifies pathogenic variant
↓
Final Diagnosis: X-Linked Agammaglobulinaemia (XLA)
